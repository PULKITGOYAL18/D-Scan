    <!-- Self-hosted local OpenCV.js (100% offline & local) -->
    <script async src="/opencv.js" type="text/javascript" id="opencv-script"></script>
    <script>
      window.isOpenCvReady = false;
      function checkOpenCv() {
        if (typeof cv !== 'undefined' && cv.Mat) {
          window.isOpenCvReady = true;
          window.dispatchEvent(new Event('opencv-ready'));
        }
      }
      var opencvScript = document.getElementById('opencv-script');
      if (opencvScript) {
        opencvScript.onload = function() {
          if (typeof cv !== 'undefined') {
            if (cv.onRuntimeInitialized) {
              var prevInit = cv.onRuntimeInitialized;
              cv.onRuntimeInitialized = function() {
                if (prevInit) prevInit();
                window.isOpenCvReady = true;
                window.dispatchEvent(new Event('opencv-ready'));
              };
            } else {
              window.isOpenCvReady = true;
              window.dispatchEvent(new Event('opencv-ready'));
            }
          }
        };
        opencvScript.onerror = function() {
          console.warn('Local OpenCV.js not initialized; using native JavaScript Computer Vision engine fallback.');
        };
      }
    </script>
